<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الوطنية لربط أسواق النفع العام | وزارة البيئة والمياه والزراعة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b1f14;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 104, 55, 0.35) 0%, rgba(2, 56, 30, 0.95) 70%, #031c10 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        /* حاوية العرض التقديمي بنسبة 16:9 المطابقة تماماً للصورة */
        .slide-wrapper {
            position: relative;
            width: 100%;
            max-width: 1320px;
            aspect-ratio: 982 / 648;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(197, 155, 39, 0.25);
            border-radius: 14px;
            overflow: hidden;
            background-color: #ffffff;
            margin: auto;
        }

        /* الصورة الأصلية للشريحة بكامل تفاصيلها وخطوطها */
        .slide-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* منطقة النقر التفاعلية على دائرة المنصة */
        .platform-hub-hotspot {
            position: absolute;
            top: 23.5%;
            left: 32.5%;
            width: 17.8%;
            height: 27%;
            border-radius: 50%;
            cursor: pointer;
            z-index: 30;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 2.5s infinite;
        }

        .platform-hub-hotspot:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 4px #c59b27, 0 0 35px 8px rgba(197, 155, 39, 0.7);
        }

        /* الهالة الدائرية النابضة */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(197, 155, 39, 0.8), 0 0 0 2px rgba(197, 155, 39, 0.5);
            }
            60% {
                box-shadow: 0 0 0 16px rgba(197, 155, 39, 0), 0 0 25px 4px rgba(197, 155, 39, 0.4);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(197, 155, 39, 0), 0 0 0 2px rgba(197, 155, 39, 0.5);
            }
        }

        /* تلميح النقر المنبثق التفاعلي */
        .hub-tooltip {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #02381e;
            color: #ffffff;
            border: 1.5px solid #c59b27;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0.95;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.25s ease;
        }

        .platform-hub-hotspot:hover .hub-tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1.08);
            background: #00542c;
            border-color: #ffd700;
        }

        /* وسوم تفاعلية للأدوار الثلاثة */
        .role-hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 20;
            border-radius: 12px;
            transition: all 0.25s ease;
        }
        .role-hotspot:hover {
            background-color: rgba(0, 104, 55, 0.06);
            outline: 2px dashed rgba(197, 155, 39, 0.6);
            outline-offset: -2px;
        }

        /* شريط الخدمات المصغر العلوي */
        .top-nav {
            width: 100%;
            background: rgba(2, 40, 21, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(197, 155, 39, 0.3);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        /* الشريط السفلي */
        .bottom-nav {
            width: 100%;
            background: rgba(1, 26, 14, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 6px 16px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
    </style>
</head>
<body class="antialiased">

    <!-- الشريط الذهبي العلوي -->
    <div class="h-1 w-full bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600"></div>

    <!-- ترويسة سريعة أنيقة غير متداخلة -->
    <header class="top-nav">
        <div class="max-w-7xl mx-auto w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="font-bold text-white text-xs sm:text-sm">المملكة العربية السعودية | وزارة البيئة والمياه والزراعة</span>
                <span class="text-amber-400 text-xs hidden sm:inline">• منظومة نما</span>
            </div>
            
            <a href="portal.html" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black px-4 py-1.5 rounded-full text-xs shadow-md flex items-center gap-1.5 transition transform hover:scale-105">
                <span>الدخول إلى التصميم المبدئي التفاعلي</span>
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            </a>
        </div>
    </header>

    <!-- مساحة عرض الشريحة المتطابقة 100% مع الصورة -->
    <main class="w-full flex-1 flex items-center justify-center p-2 sm:p-4">
        
        <div class="slide-wrapper">
            
            <!-- الشريحة الأصلية المعتمدة بتفاصيلها وتنسيقاتها وألوانها المطابقة 100% -->
            <img src="static/images/executive_slide.png" alt="المنصة الوطنية لربط أسواق النفع العام - واجهة ذكية موحدة" class="slide-image">

            <!-- ==================== 1. منطقة النقر الرئيسية: دائرة المنصة ==================== -->
            <!-- عند الضغط على المنصة يتم التحويل مباشرة إلى رابط التصميم المبدئي portal.html -->
            <a href="portal.html" class="platform-hub-hotspot" title="اضغط هنا للدخول إلى التصميم المبدئي التفاعلي للمنصة">
                <div class="hub-tooltip">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                    <span>اضغط هنا للدخول للتصميم المبدئي</span>
                    <i data-lucide="arrow-left" class="w-3 h-3 text-amber-300"></i>
                </div>
            </a>

            <!-- كما يتم إتاحة النقر على وسام التخصيص التلقائي أسفل الدائرة -->
            <a href="portal.html" style="position: absolute; top: 52%; left: 32%; width: 19%; height: 7%; z-index: 25; cursor: pointer; border-radius: 9999px;" title="الدخول إلى التصميم المبدئي للمنصة"></a>

            <!-- ==================== 2. مناطق النقر للأدوار الثلاثة للتحويل المباشر ==================== -->
            
            <!-- مدير النظام (اليمين) -->
            <a href="portal.html?role=admin" class="role-hotspot" style="top: 19%; left: 73.2%; width: 24.5%; height: 40%;" title="الانتقال إلى بوابة مدير ومراقب النظام"></a>

            <!-- المستهلك (الوسط) -->
            <a href="portal.html?role=consumer" class="role-hotspot" style="top: 19%; left: 50.2%; width: 22.8%; height: 40%;" title="الانتقال إلى متجر وتطبيق المستهلك"></a>

            <!-- البائع / المزرعة / مركز الخدمة (اليسار) -->
            <a href="portal.html?role=seller" class="role-hotspot" style="top: 19%; left: 2.5%; width: 30%; height: 40%;" title="الانتقال إلى بوابة البائع والمزارع"></a>

            <!-- البنر السفلي (مستخدم واحد .. منصة واحدة) -->
            <a href="portal.html" class="role-hotspot" style="bottom: 4%; left: 2%; width: 96%; height: 12%;" title="الدخول إلى العرض التقديمي للمنصة"></a>

        </div>

    </main>

    <!-- التذييل السفلي الخفيف -->
    <footer class="bottom-nav">
        <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
            <span class="text-[10px] sm:text-xs text-slate-400">
                وزارة البيئة والمياه والزراعة © 2026 | المنصة الوطنية لربط أسواق النفع العام
            </span>
            <div class="flex items-center gap-3 text-[10px] sm:text-xs">
                <span class="text-amber-400 font-bold">ملاحظة:</span>
                <span>اضغط على دائرة المنصة أو زر الدخول للانتقال للتصميم المبدئي التفاعلي</span>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
