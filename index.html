<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الوطنية لربط أسواق النفع العام</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* الرابط عند الضغط على منصة أسواق النفع العام */
        .hub-link {
            position: absolute;
            top: 15%;
            left: 39%;
            width: 22%;
            height: 35%;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الأصلية كما هي تماماً بدون أي تعديل أو إضافات -->
        <a href="portal.html" style="display: block; width: 100%; position: relative;">
            <img src="static/images/cover_image.png" alt="المنصة الوطنية لربط أسواق النفع العام" class="slide-img">
        </a>
    </div>

</body>
</html>
